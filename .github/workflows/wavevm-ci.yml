name: wavevm-ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_typed_smoke:
        description: "Run official typed entry smoke (wvm_ctl + wavevm_node_runtime)"
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc libssl-dev openssl

      - name: Build official production binaries
        run: |
          make -C node_runtime
          make -C ctl_tool

      - name: Upload official artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wavevm-official-binaries
          path: |
            wavevm_node_runtime
            ctl_tool/wvm_ctl
          if-no-files-found: error

  typed-entry-smoke:
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_typed_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc libssl-dev openssl

      - name: Build official production binaries
        run: |
          make -C node_runtime
          make -C ctl_tool

      - name: Official cross-host acceptance dry-check
        run: |
          bash scripts/wavevm f05 --role node-a --route-topology fractal --dry-check
          bash scripts/wavevm f10 --role node-a --route-topology flat --dry-check
          bash scripts/wavevm a4 --role node-a --route-topology fractal --dry-check

      - name: Run official typed entry smoke
        run: bash scripts/wavevm smoke --state-dir /tmp/wavevm-official-smoke

      - name: Upload official smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-entry-smoke-logs
          path: /tmp/wavevm-official-smoke/
          if-no-files-found: warn
