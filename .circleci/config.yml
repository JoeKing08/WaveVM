version: 2.1

parameters:
  accel:
    type: enum
    enum: ["tcg", "kvm"]
    default: "tcg"

jobs:
  dual-node-test:
    machine:
      image: android:default
    resource_class: large
    parameters:
      accel:
        type: enum
        enum: ["tcg", "kvm"]
    steps:
      - checkout

      - run:
          name: Check hardware
          command: |
            echo "=== requested accel ==="
            echo "<< parameters.accel >>"
            echo "=== /dev/kvm ==="
            ls -la /dev/kvm 2>/dev/null && echo "KVM FOUND" || echo "NO KVM"
            echo "=== CPU/memory ==="
            nproc
            free -m
            grep -m1 "model name" /proc/cpuinfo || true
            uname -r

      - run:
          name: Install dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential ninja-build pkg-config \
              libglib2.0-dev libpixman-1-dev python3 python3-venv qemu-utils \
              libcap-ng-dev libattr1-dev python3-setuptools lz4 genisoimage \
              linux-headers-$(uname -r) curl wget netcat-openbsd iproute2 \
              sshpass
            pip3 install setuptools || python3 -m pip install setuptools || true

      - run:
          name: Build QEMU (WaveVM)
          command: |
            cd wavevm-qemu
            chmod +x configure tests/tcg/configure.sh 2>/dev/null || true
            touch pc-bios/kvmvapic.bin
            mkdir -p build-native
            cd build-native
            ../configure --target-list=x86_64-softmmu --enable-kvm \
              --disable-docs --disable-gtk --disable-sdl --disable-vnc \
              --disable-spice --disable-usb-redir --disable-libusb \
              --disable-smartcard --disable-guest-agent
            make -j$(nproc)
          no_output_timeout: 15m

      - run:
          name: Build WaveVM services
          command: |
            make -j$(nproc) -C node_runtime
            make -j$(nproc) -C ctl_tool

      - run:
          name: Download CirrosOS image
          command: |
            mkdir -p artifacts/images
            if [ ! -f artifacts/images/cirros-0.6.2-x86_64-disk.img ]; then
              wget -q https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img \
                -O artifacts/images/cirros-0.6.2-x86_64-disk.img
            fi
            ls -la artifacts/images/

      - run:
          name: Run Dual-Node << parameters.accel >> Test
          command: |
            export WAVEVM_CI_ACCEL="<< parameters.accel >>"
            bash scripts/ci_dual_node.sh
          no_output_timeout: 20m

      - store_artifacts:
          path: /tmp/wavevm-test-results
          destination: test-results

workflows:
  dual-node-wavevm:
    jobs:
      - dual-node-test:
          name: dual-node-<< pipeline.parameters.accel >>
          accel: << pipeline.parameters.accel >>
